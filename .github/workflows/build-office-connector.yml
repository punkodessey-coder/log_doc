name: Build DocFlow Office Connector

on:
  workflow_dispatch:
  push:
    branches:
      - feature/office-connector
    paths:
      - 'office-connector/**'
      - '.github/workflows/build-office-connector.yml'

concurrency:
  group: office-connector-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build .NET Framework 4.8 add-in
        shell: pwsh
        run: |
          msbuild office-connector/src/DocFlow.OfficeConnector/DocFlow.OfficeConnector.csproj /m /t:Rebuild /restore /p:Configuration=Release /p:Platform=AnyCPU

      - name: Assemble offline installation package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'DocFlow-Office-Connector-Win11-Office-x64'
          $package = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$package/bin", "$package/scripts" | Out-Null
          Copy-Item 'office-connector/src/DocFlow.OfficeConnector/bin/Release/DocFlow.OfficeConnector.dll' "$package/bin/"
          Copy-Item 'office-connector/scripts/install.ps1' "$package/scripts/"
          Copy-Item 'office-connector/scripts/uninstall.ps1' "$package/scripts/"
          Copy-Item 'office-connector/DocFlow_Office_Uninstall.bat' "$package/УДАЛИТЬ.bat"

          @'
          @echo off
          setlocal
          chcp 65001 >nul
          title DocFlow Office Connector
          echo.
          echo ==========================================
          echo   Установка DocFlow Office Connector
          echo ==========================================
          echo.
          echo Установщик автономный: подключение к Интернету не требуется.
          echo Закройте Word, Excel и Visio перед продолжением.
          echo.
          set "DF_DLL=%~dp0bin\DocFlow.OfficeConnector.dll"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0scripts\install.ps1" -DllPath "%DF_DLL%" -OfficeBitness Auto
          if errorlevel 1 (
            echo.
            echo Ошибка установки. Смотрите сообщение PowerShell выше.
            pause
            exit /b 1
          )
          echo.
          echo Установка завершена. Перезапустите Word, Excel и Visio.
          pause
          '@ | Set-Content -Encoding UTF8 "$package/УСТАНОВИТЬ.bat"

          @'
          DocFlow Office Connector — автономный пакет
          Требования: Windows 10/11, настольный Microsoft Office x86/x64, .NET Framework 4.8.
          Установка: закройте Office и запустите УСТАНОВИТЬ.bat от имени обычного пользователя; UAC будет запрошен автоматически.
          Удаление: закройте Office и запустите УДАЛИТЬ.bat.
          Интернет и доступ к GitHub для установки не нужны.
          '@ | Set-Content -Encoding UTF8 "$package/ПРОЧИТАЙТЕ.txt"

          # Build a portable ZIP containing every file needed by the installer.
          $payloadZip = 'dist/DocFlow-Office-Connector-Payload.zip'
          Compress-Archive -Path "$package/*" -DestinationPath $payloadZip -Force
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($payloadZip))
          $wrapped = ($base64 -split '(.{1,120})' | Where-Object { $_ }) -join "`r`n"

          # The single BAT embeds the ZIP payload. At run time it only decodes
          # and extracts local data; it never contacts GitHub or the network.
          $standalone = @'
          @echo off
          setlocal EnableExtensions
          chcp 65001 >nul
          title DocFlow Office Connector - Offline Installer
          echo.
          echo ==========================================
          echo   DocFlow Office Connector
          echo   Standalone local installation
          echo ==========================================
          echo.
          echo This installer contains all required files.
          echo No GitHub or Internet connection is used.
          echo.
          set "DF_SELF=%~f0"
          set "DF_PS=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe"
          if not exist "%DF_PS%" (
            echo ERROR: Windows PowerShell was not found.
            pause
            exit /b 2
          )
          "%DF_PS%" -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; try { $raw=[IO.File]::ReadAllText($env:DF_SELF); $marker='###DOCFLOW_PAYLOAD_BASE64###'; $pos=$raw.IndexOf($marker); if($pos -lt 0){throw 'Embedded installation payload is missing.'}; $b64=($raw.Substring($pos+$marker.Length) -replace '\s',''); $bytes=[Convert]::FromBase64String($b64); if($bytes.Length -lt 10000){throw 'Embedded installation payload is incomplete.'}; $root=Join-Path $env:TEMP ('DocFlow-OfficeConnector-'+[guid]::NewGuid().ToString('N')); New-Item -ItemType Directory -Force -Path $root | Out-Null; $zip=Join-Path $root 'payload.zip'; [IO.File]::WriteAllBytes($zip,$bytes); $dest=Join-Path $root 'package'; Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force; $script=Join-Path $dest 'scripts\install.ps1'; $dll=Join-Path $dest 'bin\DocFlow.OfficeConnector.dll'; if(!(Test-Path -LiteralPath $script)){throw 'Installer script is missing from embedded package.'}; if(!(Test-Path -LiteralPath $dll)){throw 'Office connector DLL is missing from embedded package.'}; & $DF_PS -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -DllPath $dll -OfficeBitness Auto; if($LASTEXITCODE -ne 0){throw ('Installation script failed with exit code '+$LASTEXITCODE)}; Write-Host ''; Write-Host 'Installation completed. Restart Word, Excel and Visio.' -ForegroundColor Green; exit 0 } catch { Write-Host ''; Write-Host ('INSTALLATION FAILED: '+$_.Exception.Message) -ForegroundColor Red; exit 1 }"
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" (
            echo Installation failed. Exit code: %RC%
          ) else (
            echo Installation completed successfully.
          )
          echo.
          pause
          exit /b %RC%
          ###DOCFLOW_PAYLOAD_BASE64###
          '@
          $standalone = $standalone.Replace("          ", "")
          $standalone += "`r`n" + $wrapped + "`r`n"
          [IO.File]::WriteAllText('dist/DocFlow_Office_Install.bat', $standalone, [Text.Encoding]::ASCII)


      - name: Publish standalone installer to repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'dist/DocFlow_Office_Install.bat' 'office-connector/DocFlow_Office_Install.bat' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'office-connector/DocFlow_Office_Install.bat'
          git commit -m 'Publish offline DocFlow Office installer [skip ci]'
          git push

      - name: Upload offline installers
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Office-Connector-Offline-Installers
          path: |
            dist/DocFlow_Office_Install.bat
            dist/DocFlow-Office-Connector-Win11-Office-x64/
            dist/DocFlow-Office-Connector-Payload.zip
          if-no-files-found: error
          retention-days: 30
